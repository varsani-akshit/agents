[project]
name = "mia"
version = "0.1.0"
description = "Macro Intelligence Agent — continuous gold/silver/fiat/debt/crypto research"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.69",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "yfinance>=0.2.50",
    "feedparser>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "rich>=13.0",
    "tenacity>=8.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
