    asset_class: metal
    source: yfinance
    source_id: "GC=F"
  - symbol: SILVER
    name: Silver spot (COMEX front month)
    asset_class: metal
    source: yfinance
    source_id: "SI=F"
  - symbol: PLATINUM
    name: Platinum
    asset_class: metal
    source: yfinance
    source_id: "PL=F"
  - symbol: COPPER
    name: Copper
    asset_class: metal
    source: yfinance
    source_id: "HG=F"
  - symbol: DXY
    name: US Dollar Index
    asset_class: fx
    source: yfinance
    source_id: "DX-Y.NYB"
  - symbol: EURUSD
    name: EUR/USD
    asset_class: fx
    source: yfinance
    source_id: "EURUSD=X"
  - symbol: USDJPY
    name: USD/JPY
    asset_class: fx
