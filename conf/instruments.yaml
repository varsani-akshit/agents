    is_rate: true
  - symbol: US2Y
    name: US 2-year Treasury yield
    asset_class: rate
    source: fred
    source_id: "DGS2"
    is_rate: true
  - symbol: SPX
    name: S&P 500
    asset_class: equity
    source: yfinance
    source_id: "^GSPC"
  - symbol: OIL
    name: WTI crude
    asset_class: energy
    source: yfinance
    source_id: "CL=F"
  - symbol: BTC
    name: Bitcoin
    asset_class: crypto
    source: coingecko
    source_id: bitcoin
  - symbol: ETH
    name: Ethereum
    asset_class: crypto
    source: coingecko
    source_id: ethereum

# FRED macro series carried separately from prices — levels, not tradables.
fred_series:
  DGS2: US 2-year Treasury constant maturity
  DGS10: US 10-year Treasury constant maturity
  DGS30: US 30-year Treasury constant maturity
  T10YIE: 10-year breakeven inflation
  DFII10: 10-year TIPS real yield
  WALCL: Fed total assets (balance sheet)
  M2SL: M2 money stock
  GFDEBTN: Federal debt total public
  RRPONTSYD: Overnight reverse repo volume
  DTWEXBGS: Broad trade-weighted dollar index
  WTREGEN: Treasury General Account balance
  CPIAUCSL: CPI all urban consumers
  UNRATE: Unemployment rate
  FEDFUNDS: Effective federal funds rate
  # Added after the adversarial review flagged that we could not separate
  # "buybacks suppressing yields against a rising term premium" from
  # "buybacks doing nothing" — that distinction is the whole repression thesis.
  THREEFYTP10: ACM 10-year term premium
  THREEFYTP5: ACM 5-year term premium
  DGS20: US 20-year Treasury constant maturity
  DFII5: 5-year TIPS real yield
  T5YIE: 5-year breakeven inflation
  SOFR: Secured overnight financing rate
