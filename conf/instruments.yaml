  # ── FX beyond the dollar index ──────────────────────────────────────────
  # DXY is 58% euro. It cannot answer "an RBA hike is priced — what moved?",
  # and a digest that reaches that question and finds no data says so in the
  # text, which is exactly what happened on 2026-08-26.
  - symbol: AUDUSD
    name: AUD/USD
    asset_class: fx
    source: yfinance
    source_id: "AUDUSD=X"
  - symbol: GBPUSD
