# FRED macro series carried separately from prices — levels, not tradables.
fred_series:
  DGS2: US 2-year Treasury constant maturity
  DGS10: US 10-year Treasury constant maturity
  DGS30: US 30-year Treasury constant maturity
  T10YIE: 10-year breakeven inflation
  DFII10: 10-year TIPS real yield
  WALCL: Fed total assets (balance sheet)
  M2SL: M2 money stock
  GFDEBTN: Federal debt total public
  RRPONTSYD: Overnight reverse repo volume
  DTWEXBGS: Broad trade-weighted dollar index
  WTREGEN: Treasury General Account balance
  CPIAUCSL: CPI all urban consumers
  UNRATE: Unemployment rate
  FEDFUNDS: Effective federal funds rate
  # Added after the adversarial review flagged that we could not separate
  # "buybacks suppressing yields against a rising term premium" from
  # "buybacks doing nothing" — that distinction is the whole repression thesis.
  THREEFYTP10: ACM 10-year term premium
  THREEFYTP5: ACM 5-year term premium
  DGS20: US 20-year Treasury constant maturity
  DFII5: 5-year TIPS real yield
  T5YIE: 5-year breakeven inflation
  SOFR: Secured overnight financing rate
  MORTGAGE30US: 30-year fixed mortgage rate
  BAMLH0A0HYM2: US high-yield credit spread
  BAMLC0A0CM: US investment-grade credit spread
  CSUSHPINSA: Case-Shiller national home price index
  RRVRUSQ156N: Rental vacancy rate
  # Front end of the curve — where Treasury actually funds itself. Bill yields
  # versus the funding rate is how you see the TGA and issuance mix operating.
  DGS3MO: US 3-month Treasury bill yield
  DGS1MO: US 1-month Treasury bill yield
  DGS1: US 1-year Treasury constant maturity
  IORB: Interest on reserve balances
  # 5y5y forward breakeven: the market's long-run inflation anchor. If
  # debasement is being priced rather than just discussed, it shows up here
  # before it shows up in spot breakevens.
  T5YIFR: 5-year 5-year forward inflation expectation
  # System liquidity, which drives the debasement complex more reliably than
  # the policy rate does.
  WRESBAL: Reserve balances at Federal Reserve banks
  WM2NS: M2 money stock, weekly
  NFCI: Chicago Fed national financial conditions index
  # Core inflation the Fed actually targets, and two real-economy prints that
  # decide whether "sticky inflation" is demand or supply.
  PCEPILFE: Core PCE price index
  ICSA: Initial jobless claims
  INDPRO: Industrial production index
  BAMLEMCBPIOAS: EM corporate credit spread
