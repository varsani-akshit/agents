# RSS/Atom sources with credibility tiers.
#   tier 1 = official (central banks, treasuries, statistical agencies)
#   tier 2 = major financial press
#   tier 3 = sector/specialist press
#   tier 4 = low-credibility / high-noise (kept for narrative signal, never for facts)
# `official: true` makes any new item auto-escalate to at least High urgency.
#
# Every URL here was verified live on 2026-08-25. Feeds that 403 bot traffic
# (IMF, BLS) or publish no RSS at all (US Treasury) are covered by targeted
# news-proxy queries instead, marked with `proxy: true`.
#
# These carry `when:7d` rather than a shorter window for two reasons: a
# brief written after any gap in ingestion then still sees the week it is
# summarising, and the corpus keeps a week of context for search and the
# knowledge graph. Re-fetching the same week each cycle costs nothing —
# dedup is a content-hash lookup that happens before any model sees a
# document.

- name: Federal Reserve — all press
  url: https://www.federalreserve.gov/feeds/press_all.xml
  tier: 1
  official: true
- name: Federal Reserve — monetary policy
  url: https://www.federalreserve.gov/feeds/press_monetary.xml
  tier: 1
  official: true
- name: Federal Reserve — speeches
  url: https://www.federalreserve.gov/feeds/speeches.xml
  tier: 1
  official: true
- name: ECB — press
  url: https://www.ecb.europa.eu/rss/press.html
  tier: 1
  official: true
- name: Bank of England — news
  url: https://www.bankofengland.co.uk/rss/news
  tier: 1
  official: true
- name: Bank of England — publications
  url: https://www.bankofengland.co.uk/rss/publications
  tier: 1
  official: true
- name: Bank of Japan — releases
  url: https://www.boj.or.jp/en/rss/whatsnew.xml
  tier: 1
  official: true
