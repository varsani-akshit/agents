<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{% block title %}MIA{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📊</text></svg>">
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">MIA<small>macro intelligence</small></span>
    <nav>
      <a href="/" class="{{ 'on' if active=='latest' }}">Latest</a>
      <a href="/archive" class="{{ 'on' if active=='archive' }}">Archive</a>
      <a href="/ask" class="{{ 'on' if active=='ask' }}">Ask</a>
      <a href="/alerts" class="{{ 'on' if active=='alerts' }}">Alerts</a>
      <a href="/world" class="{{ 'on' if active=='world' }}">World model</a>
      <a href="/status" class="{{ 'on' if active=='status' }}">Status</a>
    </nav>
    <span class="pill">
      {% set t = summary.last_tick %}
      <span><span class="dot {{ 'ok' if t and t.ok else 'bad' }}"></span>{% if t %}tick {{ t.started_at|ago }}{% else %}no ticks{% endif %}</span>
      <span>${{ '%.2f'|format(summary.budget.spent_total_usd) }} anthropic</span>
    </span>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
